# ============================================================
# Nginx 反向代理配置（宝塔部署）
# ------------------------------------------------------------
# 宝塔用法：
#   1. 网站 → 添加站点：域名填「公网IP」或域名，类型选纯静态即可
#   2. 进入站点设置 → 配置文件，把 server { ... } 整段替换为下方内容
#   3. 把所有 /www/wwwroot/mysite 替换为你的项目实际绝对路径
#   4. server_name 改为你的公网IP/域名
#
# 关键点：
# - /static/ 和 /media/ 由 Nginx 直接 serve（不经过 gunicorn），性能最好
# - /static/ 指向 collectstatic 输出目录 STATIC_ROOT
# - /media/ 指向 MEDIA_ROOT（用户上传的数据/模型/图表）
# ============================================================
server {
    listen 80;
    # 没域名就填公网IP；有域名填域名（可多个，空格分隔）
    server_name 你的公网IP your-domain.com;

    # 上传 CSV/XLSX 大小限制（按你的数据集大小调）
    client_max_body_size 100m;

    # ---------- 静态文件：collectstatic 输出目录 = STATIC_ROOT ----------
    location /static/ {
        alias /www/wwwroot/mysite/staticfiles/;
        expires 30d;
        access_log off;
    }

    # ---------- 媒体文件：用户上传 = MEDIA_ROOT ----------
    location /media/ {
        alias /www/wwwroot/mysite/media/;
        # 中文文件名下载：由 Django FileResponse 控制 Content-Disposition，Nginx 默认 UTF-8 无需额外配置
    }

    # ---------- 其余请求反代给 gunicorn ----------
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
